; Pool de PHP-FPM sólo para las subidas de PDF de Poderes (registro público,
; editar y agregar representante). nginx manda a este pool (puerto 9001)
; únicamente esas rutas; todo lo demás sigue en el pool "www" (puerto 9000)
; con sus límites de 10 MB por archivo y 45 MB por envío.
;
; Aquí se aceptan PDF de hasta 150 MB (400 MB por envío): el acta constitutiva
; y el documento que acredita la personería; los demás documentos los limita
; PoderController a 10 MB. Se aceptan tan grandes porque el servidor
; los reduce a 20 MB con Ghostscript antes de guardarlos (App\Services\CompresorPdf),
; y eso puede tardar varios minutos con escaneos grandes.
;
; Se copia a /usr/local/etc/php-fpm.d/zz-poderes.conf desde el Dockerfile.
; Si se cambian los límites, cambiar también: client_max_body_size en
; nginx-elb.conf / nginx.conf, PDF_MAX_KB en PoderController y limite_archivos.js.
[poderes]
user = www-data
group = www-data
listen = 9001

; Pocas a la vez: cada una puede tener Ghostscript ocupando CPU y disco.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
pm.max_requests = 100

; Lo mismo que trae el pool "www" en la imagen oficial (docker.conf).
access.log = /proc/self/fd/2
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Debe ser >= fastcgi_read_timeout de la ruta en nginx.
request_terminate_timeout = 900s

php_admin_value[upload_max_filesize] = 150M
php_admin_value[post_max_size] = 410M
php_admin_value[max_input_time] = 600
php_admin_value[memory_limit] = 256M
; php_value (no admin) para que set_time_limit() del controlador pueda ajustarlo.
php_value[max_execution_time] = 600
