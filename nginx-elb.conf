server {
    listen 80;
    client_max_body_size 100M;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    error_log  /var/log/nginx/elb_error.log;
    access_log /var/log/nginx/elb_access.log;

    # Simulación de cabeceras WAF / CloudFront (Indican al Laravel la IP real del cliente)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\\.php)(/.+)$;
        # Apunta al servicio "app" en el puerto 9000 (EC2 interna)
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}