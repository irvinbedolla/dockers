services:
  # [Simulación ELB + CloudFront + WAF]
  # Actúa como el balanceador de carga público de la VPC. Recibe el tráfico y lo manda a la app.
  load-balancer:
    image: nginx:alpine
    container_name: siconcilio-elb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www
      - ./nginx-elb.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vpc-public-network
    depends_on:
      - app

  # [Simulación Instancia EC2 t4g.medium (2 CPU, 4GB RAM)]
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: siconcilio-app
    restart: unless-stopped
    tty: true
    # Limitación de hardware simulando la t4g.medium de AWS
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    volumes:
      - ./src:/var/www
    networks:
      - vpc-public-network
      - vpc-private-network
    depends_on:
      - db
      - s3-storage

  # [Simulación RDS Aurora MySQL 8.0 Serverless]
  # Removimos los puertos expuestos hacia afuera (ports: "3307:3306") para emular que está oculta 
  # en una subred privada detrás de la VPC. Solo la instancia de la app tiene acceso a ella.
  db:
    image: mysql:8.0.42 # Versión exacta compatible propuesta
    container_name: siconcilio-rds-aurora
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306" # Puerto local para pruebas, no expuesto públicamente
    environment:
      MYSQL_DATABASE: sistema-integral-qa
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_USER: admin_siconcilio
      MYSQL_PASSWORD: password_seguro_aws
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - vpc-private-network

  # [Simulación Amazon S3 Standard]
  # Servidor MinIO: Almacenamiento local compatible con las firmas S3 de Amazon SDK en Laravel
  s3-storage:
    image: minio/minio
    container_name: siconcilio-s3
    restart: unless-stopped
    ports:
      - "9000:9000" # Puerto de la API S3, necesario para que el navegador pueda abrir las URLs firmadas
      - "9001:9001" # Puerto de la consola web local para que revises tus respaldos
    volumes:
      - s3data:/data
    environment:
      MINIO_ROOT_USER: siconcilio-s3-key
      MINIO_ROOT_PASSWORD: s3_secret_password_seguro
    command: server /data --console-address ":9001"
    networks:
      - vpc-private-network

# [Simulación de la VPC (Virtual Private Cloud)]
networks:
  vpc-public-network:
    driver: bridge
  vpc-private-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  s3data:
    driver: local